name: etiketai
description: "Aplicație mobilă EtiketAI pentru importatori români"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # HTTP
  dio: ^5.8.0+1

  # Storage
  flutter_secure_storage: ^9.2.4

  # Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Image
  image_picker: ^1.1.2
  flutter_image_compress: ^2.4.0
  camera: ^0.11.0+2
  cached_network_image: ^3.4.1

  # Utilities
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.15
  freezed: ^2.5.8
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.3

flutter:
  uses-material-design: true
